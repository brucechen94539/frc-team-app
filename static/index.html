<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Team 9470 CTRL-AL-DELETE FRC Team Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ff5c1a' d='M13 2 4.5 13.5H11L9.5 22 19 9.5h-6.5z'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/static/style.css" />
<script>/* set the saved color scheme before first paint (no flash) */
(function(){try{var t=localStorage.getItem("frc-theme");
if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
</head>
<body>
<header class="topbar">
  <h1><span class="logo-frc">Team 9470</span> CTRL-AL-DELETE FRC Team Portal</h1>
  <button id="theme-btn" class="btn small ghost" title="Switch color scheme">☀ Light</button>
  <p class="tagline">Team HQ — sign-ups · events · tracking</p>
  <nav id="nav">
    <button data-view="queue">Mentor Queue <span id="nav-pending" class="badge hidden"></span></button>
    <button data-view="roster">Roster</button>
    <button data-view="events">Events &amp; RSVPs</button>
    <button data-view="tracking">Tracking</button>
    <button data-view="travel">Travel &amp; Logistics <span id="nav-rooms" class="badge hidden"></span></button>
    <button data-view="security">Security</button>
  </nav>
  <div id="account-box" class="navhide">
    <span id="user-chip" class="pill"></span>
    <button id="logout-btn" class="btn small ghost">Log out</button>
  </div>
</header>
<main id="main">
  <section id="view-signup" class="view"></section>
  <section id="view-login" class="view hidden"></section>
  <section id="view-queue" class="view hidden"></section>
  <section id="view-roster" class="view hidden"></section>
  <section id="view-events" class="view hidden"></section>
  <section id="view-tracking" class="view hidden"></section>
  <section id="view-travel" class="view hidden"></section>
  <section id="view-security" class="view hidden"></section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
